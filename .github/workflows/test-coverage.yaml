# Test coverage with covr. Writes the total to the job summary, uploads coverage.xml
# (Cobertura) to Codecov with the org CODECOV_TOKEN, and keeps it as an artifact.
# The Codecov upload is non-fatal (continue-on-error): it says nothing about the package.
# Live-network tests skip on CI (tests/testthat/helper-skip.R), so this measures the
# offline (mock and fixture) suite.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      # xgboost (a Suggests) makes .onLoad() load the xG boosters, and covr then cannot
      # serialize its counters ("Booster has not been initialized"). The xG tests are
      # NHL-gated and skip on CI anyway, so measure coverage without it.
      - name: Remove xgboost
        run: if (nzchar(p <- system.file(package = "xgboost"))) remove.packages("xgboost", lib = dirname(p))
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          pct <- sprintf("Total coverage: %.1f%%", covr::percent_coverage(cov))
          message(pct)
          cat("### ", pct, "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          covr::to_cobertura(cov, filename = "coverage.xml")
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Show testthat output
        if: always()
        run: |
          find "${RUNNER_TEMP}/package" -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
