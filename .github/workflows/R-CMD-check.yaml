# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * Fri"

name: R-CMD-check
permissions:
  contents: read
concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # R-devel is an early warning for the CRAN r-devel flavours, not a merge gate.
    continue-on-error: ${{ matrix.config.r == 'devel' }}
    # A hung step (e.g. an example stalling on a slow host) must not burn 6 h.
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      R_KEEP_PKG_SOURCE: yes
      # Live API toggles. Repository variables, not secrets: secret values are masked in
      # every log line, and these are single digits. They do not make CI hit live APIs:
      # tests/testthat/helper-skip.R calls skip_on_ci() before reading them.
      RUN_NHL_TESTS: ${{ vars.RUN_NHL_TESTS }}
      RUN_PHF_TESTS: ${{ vars.RUN_PHF_TESTS }}
      RUN_PWHL_TESTS: ${{ vars.RUN_PWHL_TESTS }}
      RUN_ESPN_TESTS: ${{ vars.RUN_ESPN_TESTS }}
      RUN_EURO_TESTS: ${{ vars.RUN_EURO_TESTS }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # xgboost is a Suggests dep; install it so the check covers .onLoad()
          # loading the xG models. (The xG tests are live-gated and skip on CI.)
          extra-packages: any::rcmdcheck, any::xgboost
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
